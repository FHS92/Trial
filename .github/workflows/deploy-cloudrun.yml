name: Deploy to Cloud Run

on:
  push:
    branches:
      - claude/edgescan-initial-setup-uiZgZ
    paths:
      - 'edgescan/backend/**'

env:
  # ── Fill these in ──────────────────────────────────────────────────────────
  GCP_PROJECT_ID: your-gcp-project-id          # e.g. edgescan-prod-123456
  CLOUD_RUN_SERVICE: edgescan-backend           # name of your Cloud Run service
  REGION: us-central1                           # Cloud Run region
  IMAGE: us-central1-docker.pkg.dev/your-gcp-project-id/edgescan/backend
  # ──────────────────────────────────────────────────────────────────────────

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # needed for Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            edgescan/backend/

      - name: Push to Artifact Registry
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" \
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars "SCAN_SECRET=${{ secrets.SCAN_SECRET }}" \
            --quiet

      - name: Show service URL
        run: |
          gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)'
